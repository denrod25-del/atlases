    <!-- JSON-LD · FAQPage (top 7 for AI-answer surfaces) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Atlases?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Atlases is an interactive learning platform for software engineering. Each atlas is a chapter-based guide on one topic — databases, Linux, networking, Docker, AI engineering, and more — with real browser sandboxes where you practice concepts as you learn them."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to install anything to use Atlases?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Every atlas runs in your browser. Terminals, code editors, databases, and simulators are all browser-based. You can start learning immediately from any device with a modern browser."
          }
        },
        {
          "@type": "Question",
          "name": "Is Atlases beginner friendly?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Each atlas lists its difficulty (Beginner, Intermediate, or Advanced) and its prerequisites. Beginners can start with foundational atlases like Python, Linux, or Encoding and progress from there."
          }
        },
        {
          "@type": "Question",
          "name": "Are the browser sandboxes real?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The Python sandbox runs real CPython via Pyodide. C and C++ use JSCPP. SQL runs against real SQLite via sql.js. The Linux terminal is a working mini-shell. What you type actually runs and produces real output."
          }
        },
        {
          "@type": "Question",
          "name": "Which atlas should I start with?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Choose a Learning Path — Backend Engineering, AI Engineering, DevOps, or Computer Science — and the path recommends a starting atlas. If you are new to software engineering, start with Python or Linux."
          }
        },
        {
          "@type": "Question",
          "name": "How long does each atlas take to complete?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Each atlas has 12 chapters and takes 6 to 16 hours depending on your prior experience. You can complete an atlas across several evenings or knock out chapters in shorter sessions."
          }
        },
        {
          "@type": "Question",
          "name": "Is Atlases free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. All atlases are free and open access. No account required. Progress saves locally to your browser — no signup, no tracking, no ads."
          }
        }
      ]
    }
    </script>
